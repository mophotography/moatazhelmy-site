name: Optimize portfolio images

on:
  push:
    branches: ["main"]
    paths:
      - ".image-optimization-trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "portfolio-image-optimization"
  cancel-in-progress: false

jobs:
  optimize-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Back up full-resolution image assets
        run: |
          zip -0 -qr "$RUNNER_TEMP/portfolio-original-images.zip" images

      - name: Upload original image backup
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-original-images-backup
          path: ${{ runner.temp }}/portfolio-original-images.zip
          retention-days: 90
          if-no-files-found: error

      - name: Resize portfolio images
        run: python tools/optimize_portfolio_images.py

      - name: Commit optimized website images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if ! git diff --cached --quiet; then
            git commit -m "Optimize public portfolio images to 1600px"
            git push origin HEAD:main
          else
            echo "No image files needed resizing."
          fi

      - name: Add optimization report to job summary
        if: always()
        run: |
          if [ -f image-optimization-report.json ]; then
            echo '### Portfolio image optimization' >> "$GITHUB_STEP_SUMMARY"
            cat image-optimization-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload optimized site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy optimized site
        id: deployment
        uses: actions/deploy-pages@v4
