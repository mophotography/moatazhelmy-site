<script>
(function(){
const nav=document.querySelector('nav'),toggle=nav.querySelector('.mobile-menu-toggle'),panel=nav.querySelector('.mobile-menu-panel'),backdrop=nav.querySelector('.mobile-menu-backdrop');
function closeMenu(){toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation menu');panel.classList.remove('is-open');backdrop.classList.remove('is-open');panel.setAttribute('aria-hidden','true');document.body.classList.remove('mobile-menu-open')}
function openMenu(){toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Close navigation menu');panel.classList.add('is-open');backdrop.classList.add('is-open');panel.setAttribute('aria-hidden','false');document.body.classList.add('mobile-menu-open')}
toggle.addEventListener('click',()=>toggle.getAttribute('aria-expanded')==='true'?closeMenu():openMenu());backdrop.addEventListener('click',closeMenu);panel.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
const lb=document.getElementById('clientLightbox'),lbImg=document.getElementById('clientLightboxImage'),close=lb.querySelector('.client-lightbox-close');
document.querySelectorAll('.client-main .ph img').forEach(img=>img.parentElement.addEventListener('click',()=>{lbImg.src=img.src;lbImg.alt=img.alt;lb.classList.add('on');lb.setAttribute('aria-hidden','false')}));
function hide(){lb.classList.remove('on');lb.setAttribute('aria-hidden','true');lbImg.src=''}close.addEventListener('click',hide);lb.addEventListener('click',e=>{if(e.target===lb)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
})();
</script>
