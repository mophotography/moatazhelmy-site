  const dimensionAttrs = dimensions ? ' width="' + dimensions[0] + '" height="' + dimensions[1] + '"' : "";
  b.innerHTML = '<img src="' + src + '" alt="' + data.name + ' — photograph ' + (i + 1) + '"' + dimensionAttrs + ' loading="lazy" decoding="async">';

  gallery.appendChild(b);
});

if (key === "granitainterior") {
  const cards = Array.from(gallery.querySelectorAll(":scope > .ph"));
  function arrangeGranitaArkanMasonry() {
    const width = gallery.clientWidth;
    if (!width) return;
    const columnsCount = window.matchMedia("(max-width:700px)").matches ? 1 :
      (window.matchMedia("(max-width:900px)").matches ? 2 : 3);
    const gap = 12;
    const columnWidth = (width - gap * (columnsCount - 1)) / columnsCount;
    const heights = Array(columnsCount).fill(0);
    const columns = Array.from({length: columnsCount}, () => {
      const column = document.createElement("div");
      column.className = "granita-arkan-masonry-column";
      return column;
    });
    cards.forEach(card => {
      const img = card.querySelector("img");
      const imageWidth = Number(img.getAttribute("width")) || img.naturalWidth || 1;
      const imageHeight = Number(img.getAttribute("height")) || img.naturalHeight || 1;
      let target = 0;
      for (let i = 1; i < columnsCount; i++) {
        if (heights[i] < heights[target]) target = i;
      }
      columns[target].appendChild(card);
      heights[target] += columnWidth * imageHeight / imageWidth + gap;
    });
    gallery.replaceChildren(...columns);
  }
  arrangeGranitaArkanMasonry();
  window.addEventListener("resize", arrangeGranitaArkanMasonry);
}

    { portrait:"DSC_6890.jpg", portraitColumn:3, portraitWidth:"89.2%", rows:[["DSC_6856.jpg","DSC_1995.jpg"],["DSC_6434.jpg","DSC_0067.jpg"]] }
  ];
  const mosaic = document.createDocumentFragment();
  blockPlans.forEach(plan => {
    const block = document.createElement("div");
    block.className = "granita-zamalek-mosaic-block";
    const portrait = cardByFile.get(plan.portrait);
    portrait.classList.add("granita-zamalek-portrait");
    portrait.style.gridColumn = String(plan.portraitColumn);
    portrait.style.gridRow = "1 / span 2";
    portrait.style.width = plan.portraitWidth;
    portrait.style.justifySelf = "center";
    block.appendChild(portrait);
    plan.rows.forEach((row, rowIndex) => {
      row.forEach(file => {
        const card = cardByFile.get(file);
        const image = card.querySelector("img");
        const originalDimensions = data.imageDimensions[file];
        image.width = originalDimensions[0];
        image.height = originalDimensions[1];
        const column = [1,2,3].filter(c => c !== plan.portraitColumn);
        const index = row.indexOf(file);
        card.style.gridColumn = String(column[index]);
        card.style.gridRow = String(rowIndex + 1);
        block.appendChild(card);
      });
    });
    mosaic.appendChild(block);
  });
  const finalRow = document.createElement("div");
  finalRow.className = "granita-zamalek-final-row";
  ["DSC_2060.jpg","DSC_1949.jpg","DSC_2071.jpg"].forEach(file => finalRow.appendChild(cardByFile.get(file)));
  mosaic.appendChild(finalRow);
  gallery.classList.add("granita-zamalek-mosaic");
  gallery.replaceChildren(mosaic);
}

if (key === "granitainterior" && data.featuredImage) {
  const featured = document.createElement("div");
  featured.className = "granita-arkan-entrance-feature";
  const button = document.createElement("button");
  button.type = "button";
  button.className = "ph";
  button.setAttribute("aria-label", "View Granita Arkan exterior entrance");
  const featuredSize = data.featuredImageDimensions || [6016, 2672];
  button.innerHTML = '<img src="' + data.featuredImage + '" alt="Granita Arkan — exterior entrance" width="' + featuredSize[0] + '" height="' + featuredSize[1] + '" loading="lazy" decoding="async">';
  button.addEventListener("click", () => openLightbox(data.featuredImage, "Granita Arkan — exterior entrance"));
  featured.appendChild(button);
  gallery.insertAdjacentElement("afterend", featured);
}

function openLightbox(src, alt) {
  lbImg.src = src;
  lbImg.alt = alt;
  lb.classList.add("on");
  lb.setAttribute("aria-hidden", "false");
}

function closeLightbox() {
  lb.classList.remove("on");
  lb.setAttribute("aria-hidden", "true");
  lbImg.src = "";
}

lb.addEventListener("click", e => {
  if (e.target === lb) closeLightbox();
});
document.querySelector(".client-lightbox-close").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});
</script>
<script>
(function(){
 const nav=document.querySelector('nav');
 if(!nav)return;
 const toggle=nav.querySelector('.mobile-menu-toggle');
 const panel=nav.querySelector('.mobile-menu-panel');
 const backdrop=nav.querySelector('.mobile-menu-backdrop');
 function closeMenu(){
  toggle.setAttribute('aria-expanded','false');
  toggle.setAttribute('aria-label','Open navigation menu');
  panel.classList.remove('is-open');
  backdrop.classList.remove('is-open');
  panel.setAttribute('aria-hidden','true');
  document.body.classList.remove('mobile-menu-open');
 }
 function openMenu(){
  toggle.setAttribute('aria-expanded','true');
  toggle.setAttribute('aria-label','Close navigation menu');
  panel.classList.add('is-open');
  backdrop.classList.add('is-open');
  panel.setAttribute('aria-hidden','false');
  document.body.classList.add('mobile-menu-open');
 }
 toggle.addEventListener('click',function(){toggle.getAttribute('aria-expanded')==='true'?closeMenu():openMenu()});
 backdrop.addEventListener('click',closeMenu);
 panel.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeMenu)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
})();
</script><script src="analytics-consent.js"></script>
