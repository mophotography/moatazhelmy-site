<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commercial | Moataz Helmy Photography</title>
<meta name="description" content="Commercial client portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="inner commercial-client">
<nav>
  <a class="nm" href="index.html">Moataz Helmy</a>
  <div class="links">
    <a href="commercial.html">Commercial</a><a href="food.html">Food</a><a href="art.html">Art</a><a href="street.html">Street</a><a href="people.html">People</a><a href="prints.html">Prints</a><a href="about.html">About</a><a href="contact.html">Contact</a>
  </div>
</nav>
<main class="wrap">
  <div class="client-shell">
    <aside class="client-side">
      <a class="back" href="commercial.html">← Commercial</a>
      <div class="client-side-title">Clients</div>
      <div class="client-list" id="clientList"></div>
    </aside>
    <section class="client-main">
      <div class="client-kicker">COMMERCIAL</div>
      <h1 id="clientTitle">Client</h1>
      <div class="client-project-title" id="projectTitle"></div>
      <div class="commercial-gallery" id="gallery"></div>
    </section>
  </div>
</main>
<footer>© Moataz Helmy Photography</footer>
<div id="clientLightbox" class="client-lightbox" aria-hidden="true">
  <button type="button" class="client-lightbox-close" aria-label="Close">×</button>
  <div class="client-lightbox-frame"><img id="clientLightboxImage" alt=""></div>
</div>
<script>
const clients={
  allweiler:{name:"Allweiler-Farid Pumps",source:"images/commercial/allweiler.webp",rows:2,cols:4,title:"Selected work"},
  elnour:{name:"Al Nour for Metals",source:"images/commercial/elnour.webp",rows:2,cols:4,title:"Selected work"},
  fdc:{name:"FDC — First Dental Center",source:"images/commercial/fdc.webp",rows:2,cols:4,title:"Zamalek"},
  wtc:{name:"WTC Hotel",source:"images/commercial/wtc.webp",rows:2,cols:4,title:"Selected work"}
};
const params=new URLSearchParams(location.search);
const key=params.get("client")||"allweiler";
const data=clients[key]||clients.allweiler;

document.getElementById("clientTitle").textContent=data.name;
document.getElementById("projectTitle").textContent=data.title;

document.getElementById("clientList").innerHTML=Object.entries(clients).map(([k,v])=>
  '<a href="commercial-client.html?client='+k+'" class="'+(k===key?'active':'')+'">'+v.name+'</a>'
).join("");

const gallery=document.getElementById("gallery");
const positions=[
  [0,0],[1,0],[2,0],[3,0],
  [0,1],[1,1]
];

positions.forEach((pos,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="photo-slice";
  b.setAttribute("aria-label","View photograph "+(i+1));
  b.style.setProperty("--col",pos[0]);
  b.style.setProperty("--row",pos[1]);
  b.innerHTML='<img src="'+data.source+'" alt="">';
  b.addEventListener("click",()=>openLightbox(pos[0],pos[1]));
  gallery.appendChild(b);
});

const lb=document.getElementById("clientLightbox");
const lbImg=document.getElementById("clientLightboxImage");
function openLightbox(col,row){
  lbImg.src=data.source;
  lbImg.style.setProperty("--col",col);
  lbImg.style.setProperty("--row",row);
  lb.classList.add("on");
  lb.setAttribute("aria-hidden","false");
}
function closeLightbox(){
  lb.classList.remove("on");
  lb.setAttribute("aria-hidden","true");
}
lb.addEventListener("click",e=>{if(e.target===lb)closeLightbox()});
document.querySelector(".client-lightbox-close").addEventListener("click",closeLightbox);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox()});
</script>
</body>
</html>
