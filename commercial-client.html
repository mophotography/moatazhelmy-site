<script>
const clients = {
  allweiler: {
    name: "Allweiler-Farid Pumps",
    title: "Selected work",
    images: [
      "images/commercial/AlWeiler Farid/DSC_0666.JPG",
      "images/commercial/AlWeiler Farid/DSC_0669.JPG",
      "images/commercial/AlWeiler Farid/DSC_0670.JPG",
      "images/commercial/AlWeiler Farid/DSC_0694.JPG",
      "images/commercial/AlWeiler Farid/DSC_0771.JPG",
      "images/commercial/AlWeiler Farid/DSC_0919.JPG",
      "images/commercial/AlWeiler Farid/DSC_7294.JPG",
      "images/commercial/AlWeiler Farid/DSC_7380.JPG",
      "images/commercial/AlWeiler Farid/DSC_7495.JPG",
      "images/commercial/AlWeiler Farid/DSC_7503.JPG",
      "images/commercial/AlWeiler Farid/DSC_7554.JPG",
      "images/commercial/AlWeiler Farid/DSC_7564.JPG",
      "images/commercial/AlWeiler Farid/DSC_7604.JPG",
      "images/commercial/AlWeiler Farid/DSC_7686-2.JPG",
      "images/commercial/AlWeiler Farid/DSC_7686.JPG",
      "images/commercial/AlWeiler Farid/DSC_7709.JPG",
      "images/commercial/AlWeiler Farid/DSC_8952.JPG"
    ]
  },
  elnour: {
    name: "Al Nour for Metals",
    title: "Factory",
    images: [
      "images/commercial/El Nour Factory/DSC_8409.JPG",
      "images/commercial/El Nour Factory/DSC_8414.JPG",
      "images/commercial/El Nour Factory/DSC_8432.JPG",
      "images/commercial/El Nour Factory/DSC_8441.JPG",
      "images/commercial/El Nour Factory/DSC_8545 copy.jpg"
    ]
  },
  fdc: {
    name: "FDC — First Dental Center",
    title: "Zamalek",
    images: [
      "images/commercial/FDC/_DSC6493-HDR.JPG",
      "images/commercial/FDC/_DSC6530.JPG",
      "images/commercial/FDC/_DSC6610.JPG",
      "images/commercial/FDC/_DSC6681-HDR.JPG",
      "images/commercial/FDC/_DSC6719.JPG",
      "images/commercial/FDC/_DSC6757.JPG",
      "images/commercial/FDC/_DSC6790-HDR.JPG"
    ]
  },
  wtc: {
    name: "WTC Hotel",
    title: "Hotel",
    images: [
      "images/commercial/WTC Hotel/13.JPG",
      "images/commercial/WTC Hotel/14.JPG",
      "images/commercial/WTC Hotel/18.JPG",
      "images/commercial/WTC Hotel/19.JPG",
      "images/commercial/WTC Hotel/2.JPG",
      "images/commercial/WTC Hotel/4.JPG",
      "images/commercial/WTC Hotel/_DSC3218.JPG",
      "images/commercial/WTC Hotel/_DSC3225.JPG",
      "images/commercial/WTC Hotel/_DSC3227.JPG"
    ]
  }
};

const params = new URLSearchParams(location.search);
const key = params.get("client") || "allweiler";
const data = clients[key] || clients.allweiler;

document.getElementById("clientTitle").textContent = data.name;
document.getElementById("projectTitle").textContent = data.title;

document.getElementById("clientList").innerHTML = Object.entries(clients).map(([k, v]) =>
  '<a href="commercial-client.html?client=' + k + '" class="' + (k === key ? 'active' : '') + '">' + v.name + '</a>'
).join("");

const gallery = document.getElementById("gallery");
const lb = document.getElementById("clientLightbox");
const lbImg = document.getElementById("clientLightboxImage");

data.images.forEach((src, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ph";
  b.setAttribute("aria-label", "View photograph " + (i + 1));
  b.innerHTML = '<img src="' + src + '" alt="' + data.name + ' — photograph ' + (i + 1) + '" loading="lazy">';
  b.addEventListener("click", () => openLightbox(src, data.name + " — photograph " + (i + 1)));
  gallery.appendChild(b);
});

function openLightbox(src, alt) {
  lbImg.src = src;
  lbImg.alt = alt;
  lb.classList.add("on");
  lb.setAttribute("aria-hidden", "false");
}

function closeLightbox() {
  lb.classList.remove("on");
  lb.setAttribute("aria-hidden", "true");
  lbImg.src = "";
}

lb.addEventListener("click", e => {
  if (e.target === lb) closeLightbox();
});
document.querySelector(".client-lightbox-close").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});
</script>
<script>
(function(){
 const nav=document.querySelector('nav');
 if(!nav)return;
 const toggle=nav.querySelector('.mobile-menu-toggle');
 const panel=nav.querySelector('.mobile-menu-panel');
 const backdrop=nav.querySelector('.mobile-menu-backdrop');
 function closeMenu(){
  toggle.setAttribute('aria-expanded','false');
  toggle.setAttribute('aria-label','Open navigation menu');
  panel.classList.remove('is-open');
  backdrop.classList.remove('is-open');
  panel.setAttribute('aria-hidden','true');
  document.body.classList.remove('mobile-menu-open');
 }
 function openMenu(){
  toggle.setAttribute('aria-expanded','true');
  toggle.setAttribute('aria-label','Close navigation menu');
  panel.classList.add('is-open');
  backdrop.classList.add('is-open');
  panel.setAttribute('aria-hidden','false');
  document.body.classList.add('mobile-menu-open');
 }
 toggle.addEventListener('click',function(){toggle.getAttribute('aria-expanded')==='true'?closeMenu():openMenu()});
 backdrop.addEventListener('click',closeMenu);
 panel.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeMenu)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
})();
</script><script src="analytics-consent.js"></script>
