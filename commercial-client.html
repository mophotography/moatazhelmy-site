<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Commercial Client | Moataz Helmy Photography</title><meta name="description" content="Commercial client portfolio"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="inner commercial-client"><nav><a class="nm" href="index.html">Moataz Helmy</a><div class="links"><a href="commercial.html">Commercial</a><a href="food.html">Food</a><a href="art.html">Art</a><a href="street.html">Street</a><a href="people.html">People</a><a href="prints.html">Prints</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></nav><main class="wrap"><div class="client-shell"><aside class="client-side"><a class="back" href="commercial.html">← All clients</a><div class="client-side-title">Clients</div><nav class="client-list" id="clientList"></nav></aside><section class="client-main"><div class="client-kicker">COMMERCIAL</div><h1 id="clientTitle">Client</h1><p class="section-intro" id="clientIntro"></p><div class="project-head"><span>PROJECTS</span><span id="clientCount"></span></div><div class="project-list" id="projectList"></div></section></div></main><footer>© Moataz Helmy Photography</footer><script>
const clients={
 allweiler:{name:"Allweiler-Farid Pumps",count:18},
 elnour:{name:"Al Nour for Metals",count:5},

 wtc:{name:"WTC Hotel",count:9}
};
const params=new URLSearchParams(location.search); const key=params.get("client")||"allweiler"; const data=clients[key]||clients.allweiler;
document.getElementById("clientTitle").textContent=data.name;
document.getElementById("clientCount").textContent=data.count+" photographs";

const labels=["allweiler","elnour","fdc","wtc"];
document.getElementById("clientList").innerHTML=labels.map(k=>{const c=clients[k];return '<a href="commercial-client.html?client='+k+'" class="'+(k===key?'active':'')+'"><span>'+c.name+'</span><small>'+c.count+' photos</small></a>';}).join("");
const projectList=document.getElementById("projectList");
projectList.innerHTML='<article class="project-placeholder"><div><span class="placeholder-no">01</span><h2>Project 01</h2><p>Photographs will be placed here once the client set is prepared and projects are grouped.</p></div><div class="placeholder-grid">'+Array.from({length:Math.min(data.count,6)},(_,i)=>'<div class="photo-slot">'+String(i+1).padStart(2,"0")+'</div>').join("")+'</div></article>';
</script></body></html>
